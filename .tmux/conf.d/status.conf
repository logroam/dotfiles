# Status line
set-option -g status-interval 5
set-option -g status-position top
set-option -g status-justify "centre"
set-option -g visual-activity on
set-window-option -g monitor-activity on
set-option -g status-left-length 120
set-option -g status-left "#[fg=#101820,bg=#5fff87,bold] #S #[fg=#5fff87,bg=default] #[default]#{?client_prefix,#[fg=#101820,bg=#f7768e,bold] PREFIX #[default] ,}#{?pane_in_mode,#[fg=#101820,bg=#e0af68,bold] COPY #[default] ,}#{?window_zoomed_flag,#[fg=#101820,bg=#7aa2f7,bold] ZOOM #[default] ,}#{?pane_synchronized,#[fg=#101820,bg=#bb9af7,bold] SYNC #[default] ,}"
set-window-option -g window-status-separator ""
set-window-option -g window-status-format "#[fg=#5a606a,bg=default]  #I:#W#{?window_flags, #[fg=#e0af68]#{window_flags}#[fg=#5a606a],}  #[default]"
set-window-option -g window-status-current-format "#[fg=#5fff87,bg=default,bold]#[fg=#101820,bg=#5fff87,bold] #I:#W#{?window_zoomed_flag, Z,}#{?window_flags, #{window_flags},} #[fg=#5fff87,bg=default,bold]#[default]"
set-option -g status-right-length 180
set-option -g status-right "#[fg=#8a8f98]#(${HOME}/.bin/tmux-status-google) #[fg=#3a3f46]|#[fg=#8a8f98] Mem #(${HOME}/.bin/tmux-status-mem) #[fg=#3a3f46]|#[fg=#8a8f98] LA #(${HOME}/.bin/tmux-status-load) #[fg=#3a3f46]|#[fg=#5fff87] %m/%d %H:%M#[default]"
